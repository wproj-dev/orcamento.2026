<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Financeiro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Painel Financeiro</h1>
    </header>
    
    <main>
        <section class="cards-row" id="dashboard-container">
            <!-- Cards gerados via JavaScript -->
            <div class="card card-discricionario">
                <h3>Discricionário</h3>
                <p class="valor" id="valor-discricionario">R$ 0,00</p>
            </div>
            <div class="card card-pac">
                <h3>PAC</h3>
                <p class="valor" id="valor-pac">R$ 0,00</p>
            </div>
            <div class="card card-emendas">
                <h3>Emendas</h3>
                <p class="valor" id="valor-emendas">R$ 0,00</p>
            </div>
            <div class="card card-bloqueado">
                <h3>Bloqueado</h3>
                <p class="valor" id="valor-bloqueado">R$ 0,00</p>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
